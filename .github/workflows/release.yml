name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decide signing mode
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          signed=true
          for var in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::warning::Secret $var is not set; publishing a debug-signed APK (see README > Signing a release)"
              signed=false
            fi
          done
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        if: steps.signing.outputs.signed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/grabi-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/grabi-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        if: steps.signing.outputs.signed != 'true'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            mv app/build/outputs/apk/release/app-release.apk "grabi-${GITHUB_REF_NAME}.apk"
          else
            mv app/build/outputs/apk/debug/app-debug.apk "grabi-${GITHUB_REF_NAME}.apk"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: grabi-${{ github.ref_name }}.apk
          generate_release_notes: true
          body: "${{ steps.signing.outputs.signed == 'true' && 'Signed release build.' || 'Debug-signed build (signing secrets not configured). Installable via sideloading; add the signing secrets and push a new tag for properly signed releases - see README > Signing a release.' }}"